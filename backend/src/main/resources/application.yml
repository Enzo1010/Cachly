spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cachly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

api:
  security:
    token:
      secret: ${JWT_SECRET:segredo-padrao-de-desenvolvimento-local-do-cachly-com-tamanho-suficiente-para-hmac-sha}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
