spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/cachly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}

app:
  timezone: America/Sao_Paulo
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  apps-script:
    url: ${APPS_SCRIPT_URL}
    secret: ${APPS_SCRIPT_SECRET}

ranking:
  historico:
    top-n: 10
