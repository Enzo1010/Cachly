<div class="estrutura-aplicacao" [class.estrutura-aplicacao--menu-aberto]="menuAberto()">
  <button
    class="camada-menu"
    type="button"
    aria-label="Fechar menu de navegação"
    (click)="fecharMenu()"
  ></button>

  <aside id="menu-principal" class="barra-lateral" aria-label="Navegação principal">
    <div class="marca">
      <img src="/questly-logo-branco-transparente.png" alt="Questly" />
    </div>

    <nav class="navegacao">
      <ul>
        @for (item of navegacaoPrincipal; track item.rotulo) {
          <li>
            <a
              [routerLink]="item.rota"
              routerLinkActive="item-navegacao--ativo"
              [routerLinkActiveOptions]="{ exact: true }"
              class="item-navegacao"
              (click)="fecharMenu()"
            >
              <i [class]="item.icone" aria-hidden="true"></i>
              <span>{{ item.rotulo }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <a
      class="resumo-perfil"
      routerLink="/dashboard/perfil"
      routerLinkActive="resumo-perfil--ativo"
      [attr.aria-label]="'Abrir perfil de ' + (sessao.usuario()?.nome ?? 'usuário')"
      (click)="fecharMenu()"
    >
      <div class="perfil">
        <span class="perfil__avatar" aria-hidden="true">{{
          (sessao.usuario()?.nome ?? 'U').charAt(0).toUpperCase()
        }}</span>
        <div>
          <strong>{{ sessao.usuario()?.nome }}</strong>
          <span>Nível {{ sessao.usuario()?.nivel }}</span>
        </div>
      </div>
      <dl class="indicadores-perfil">
        <div>
          <dt><i class="pi pi-fire" aria-hidden="true"></i> Streak</dt>
          <dd>12 dias</dd>
        </div>
        <div>
          <dt><i class="pi pi-star-fill" aria-hidden="true"></i> XP</dt>
          <dd>{{ sessao.usuario()?.xpTotal }}</dd>
        </div>
      </dl>
    </a>
  </aside>

  <div class="conteudo-aplicacao">
    <header class="topo">
      <button
        pButton
        class="botao-menu"
        type="button"
        [attr.aria-expanded]="menuAberto()"
        aria-controls="menu-principal"
        aria-label="Abrir menu de navegação"
        (click)="alternarMenu()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <h1>{{ tituloPagina() }}</h1>
      <div class="progresso-xp" aria-label="0 de 1000 pontos de experiência">
        <span>0 / 1000</span>
        <span class="progresso-xp__trilha" aria-hidden="true"><span></span></span>
      </div>
      <button pButton class="botao-sair" type="button" (click)="sair()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span>Sair</span>
      </button>
    </header>

    <main class="conteudo-pagina">
      <router-outlet />
    </main>
  </div>
</div>
