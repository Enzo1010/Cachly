<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <div class="field">
    <label class="field-label" id="lbl-tamanho-cache">
      <i class="pi pi-database"></i> Tamanho da Cache
    </label>
    <p-selectButton
      formControlName="tamanhoCacheBytes"
      aria-labelledby="lbl-tamanho-cache"
      [options]="tamanhoOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
      styleClass="w-full">
    </p-selectButton>
  </div>

  <div class="field">
    <label class="field-label" id="lbl-tamanho-bloco">
      <i class="pi pi-box"></i> Tamanho do Bloco
    </label>
    <p-selectButton
      formControlName="tamanhoBlocoBytes"
      aria-labelledby="lbl-tamanho-bloco"
      [options]="blocoOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
      styleClass="w-full">
    </p-selectButton>
  </div>

  <div class="field">
    <label class="field-label" id="lbl-mapeamento">
      <i class="pi pi-sitemap"></i> Mapeamento
    </label>
    <p-selectButton
      formControlName="mapeamento"
      aria-labelledby="lbl-mapeamento"
      [options]="mapeamentoOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
      styleClass="w-full">
    </p-selectButton>
  </div>

  @if (form.controls.mapeamento.value === 'CONJUNTO_ASSOCIATIVO') {
    <div class="field">
      <label class="field-label" id="lbl-numero-vias">
        <i class="pi pi-arrows-alt"></i> Número de Vias
      </label>
      <p-selectButton
        formControlName="numeroVias"
        aria-labelledby="lbl-numero-vias"
        [options]="viasOptions"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
        styleClass="w-full">
      </p-selectButton>
    </div>
  }

  @if (form.controls.mapeamento.value !== 'DIRETO') {
    <div class="field">
      <label class="field-label" id="lbl-substituicao">
        <i class="pi pi-sync"></i> Política de Substituição
      </label>
      <p-selectButton
        formControlName="substituicao"
        aria-labelledby="lbl-substituicao"
        [options]="politicaOptions"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
        styleClass="w-full">
      </p-selectButton>
    </div>
  }

  <div class="field">
    <div class="field-header">
      <label class="field-label" for="enderecosStr">
        <i class="pi pi-list-check"></i> Endereços de Acesso
      </label>
      <button
        type="button"
        class="btn-random"
        pTooltip="Gerar 10 endereços decimais aleatórios"
        tooltipPosition="top"
        (click)="gerarEnderecosAleatorios(10, 64)"
      >
        <i class="pi pi-sparkles"></i>
        <span>Aleatórios</span>
      </button>
    </div>

    <!-- Presets Didáticos em Grid 2x2 -->
    <div class="presets-section">
      <span class="presets-bar-title">Padrões Prontos</span>
      <div class="presets-grid">
        @for (preset of presets; track preset.nome) {
          <button
            type="button"
            class="preset-btn"
            [class.preset-btn--active]="form.controls.enderecosStr.value === preset.enderecos"
            [pTooltip]="preset.descricao"
            tooltipPosition="top"
            (click)="carregarPreset(preset.enderecos)"
          >
            <i [class]="preset.icone"></i>
            <span class="preset-name">{{ preset.nome }}</span>
          </button>
        }
      </div>
    </div>

    <input
      pInputText
      id="enderecosStr"
      formControlName="enderecosStr"
      placeholder="Ex: 0, 4, 8, 12, 0, 4" />
    <span class="field-hint">Valores decimais separados por vírgula.</span>
  </div>

  <p-button
    type="submit"
    label="Iniciar Simulação"
    icon="pi pi-play"
    styleClass="w-full btn-simular"
    [disabled]="form.invalid || loading"
    [loading]="loading">
  </p-button>

</form>
