version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cachly_db
    environment:
      POSTGRES_DB: cachly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - cachly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cachly"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cachly_backend
    environment:
      - DB_URL=jdbc:postgresql://db:5432/cachly
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=24
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - APPS_SCRIPT_URL=${APPS_SCRIPT_URL:-https://script.google.com/macros/s/dummy/exec}
      - APPS_SCRIPT_SECRET=${APPS_SCRIPT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cachly_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  cachly_data:
